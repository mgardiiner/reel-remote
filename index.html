<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reel Remote">
<meta name="referrer" content="no-referrer">
<!-- The page talks to the relay and nothing else; the remote's direct connection to the TV is WebRTC, which CSP does not cover. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ntfy.sh; img-src data:; base-uri 'none'; form-action 'none'">
<title>Reel Remote</title>
<style>
  :root { --bg: #0f1115; --bg2: #171a21; --bg3: #1f232c; --bg4: #2a2f3b; --fg: #e7e9ee; --muted: #8b93a5; --accent: #e5a00d; --line: #262b36; --ok: #4cc38a; --bad: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok::before { background: var(--ok); }
  .status.bad::before { background: var(--bad); }
  button { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg3); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  button:disabled { opacity: .5; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; }
  .link { background: none; border: none; padding: 12px 0; color: var(--muted); font-weight: 500; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 24px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { padding: 10px; border: none; border-radius: 9px; background: none; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--bg4); color: var(--fg); }

  /* Remote */
  .remote { display: flex; flex-direction: column; align-items: center; gap: 20px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .remote button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .rstatus { min-height: 1.45em; margin: 0; text-align: center; font-size: 14px; color: var(--muted); }
  .rstatus .link { padding: 0 0 0 6px; color: var(--accent); }
  .chip { width: 100%; padding: 12px 16px; text-align: left; font-weight: 500; color: var(--muted); }
  .chip b { color: var(--fg); }
  .wheel { position: relative; width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); touch-action: none; }
  .wheel[data-lit="up"] { background: conic-gradient(from -45deg, var(--bg4) 0 90deg, var(--bg2) 0); }
  .wheel[data-lit="right"] { background: conic-gradient(from 45deg, var(--bg4) 0 90deg, var(--bg2) 0); }
  .wheel[data-lit="down"] { background: conic-gradient(from 135deg, var(--bg4) 0 90deg, var(--bg2) 0); }
  .wheel[data-lit="left"] { background: conic-gradient(from 225deg, var(--bg4) 0 90deg, var(--bg2) 0); }
  .wheel button { position: absolute; display: grid; place-items: center; padding: 0; border: none; background: none; color: var(--muted); pointer-events: none; }
  .wheel .arrow { width: 22%; height: 22%; }
  .wheel .arrow svg { width: 30px; height: 30px; }
  .wheel [data-key="up"] { top: 4%; left: 39%; }
  .wheel [data-key="down"] { bottom: 4%; left: 39%; }
  .wheel [data-key="left"] { left: 4%; top: 39%; }
  .wheel [data-key="right"] { right: 4%; top: 39%; }
  .wheel [data-key="ok"] { left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%; background: var(--bg3); border: 1px solid var(--line); color: var(--fg); font-size: 18px; }
  .wheel[data-lit="ok"] [data-key="ok"] { background: var(--accent); border-color: var(--accent); color: #111; }
  .wheel[data-lit="up"] [data-key="up"], .wheel[data-lit="down"] [data-key="down"], .wheel[data-lit="left"] [data-key="left"], .wheel[data-lit="right"] [data-key="right"] { color: var(--accent); }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; }
  .keys.two { grid-template-columns: 1fr 1fr; }
  .keys button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px; }
  .keys button.lit { background: var(--bg4); }
  .keys svg { width: 22px; height: 22px; }
  .remote.off .wheel, .remote.off .keys { opacity: .35; pointer-events: none; }

  /* Keyboard */
  .label { margin: 0 0 10px; color: var(--muted); }
  .label b { color: var(--fg); }
  .field { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 14px 16px; font-size: 18px; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; outline: none; }
  input:focus { border-color: var(--accent); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .feedback { min-height: 1.45em; margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .feedback.ok, .rstatus.ok { color: var(--ok); }
  .feedback.bad, .rstatus.bad { color: var(--bad); }
  .note { margin-top: 28px; font-size: 14px; color: var(--muted); text-align: center; }

  /* Sync handoff */
  .handoff { margin-bottom: 20px; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--accent); border-radius: 12px; }
  .handoff p { margin: 0; }
  .handoff-title { font-weight: 600; margin-bottom: 4px !important; }
  #handoff-text { color: var(--muted); }
  #handoff-text b { color: var(--fg); }
  #handoff-text.ok { color: var(--ok); }
  #handoff-text.bad { color: var(--bad); }
  .handoff button { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Reel <span>Remote</span></h1>
    <span id="status" class="status">Connecting…</span>
  </header>

  <!-- Opened from a code on the Mac: this device's sync login, passed on to the TV. -->
  <div id="handoff" class="handoff" hidden>
    <p class="handoff-title">Sync to TV</p>
    <p id="handoff-text" role="status"></p>
    <button type="button" id="handoff-send" class="primary" hidden>Send to TV</button>
  </div>

  <section id="paired" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-remote" aria-controls="remote" aria-selected="false">Remote</button>
      <button type="button" role="tab" id="tab-keys" aria-controls="keys" aria-selected="true">Keyboard</button>
    </div>

    <div id="remote" class="remote off" role="tabpanel" aria-labelledby="tab-remote" hidden>
      <p class="rstatus" id="rstatus" role="status">Waiting for the TV…</p>
      <button type="button" id="chip" class="chip" hidden>Type into <b id="chip-label"></b></button>
      <div class="wheel" id="wheel">
        <button type="button" class="arrow" data-key="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button type="button" class="arrow" data-key="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <button type="button" class="arrow" data-key="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="arrow" data-key="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <button type="button" data-key="ok">OK</button>
      </div>
      <div class="keys two">
        <button type="button" data-key="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Back</button>
        <button type="button" data-key="star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>My List</button>
      </div>
      <div class="keys">
        <button type="button" data-key="rewind" aria-label="Rewind"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12l-8.5-6zM21 6v12l-8.5-6z"/></svg></button>
        <button type="button" data-key="playpause" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14l9-7zM14 5h3v14h-3zM19 5h3v14h-3z"/></svg></button>
        <button type="button" data-key="forward" aria-label="Fast forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12l8.5-6zM13 6v12l8.5-6z"/></svg></button>
      </div>
    </div>

    <div id="keys" role="tabpanel" aria-labelledby="tab-keys">
      <p class="label" id="label">Select a text box on the TV</p>
      <form id="form">
        <div class="field">
          <input id="field" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-labelledby="label">
          <button type="button" id="reveal" hidden>Show</button>
        </div>
        <div class="buttons">
          <button type="submit" id="send" class="primary">Send</button>
          <button type="button" id="enter">Send + Enter</button>
        </div>
        <button type="button" id="clear" class="link">Clear</button>
        <p class="feedback" id="feedback" role="status"></p>
      </form>
    </div>

    <p class="note">Keep this page open, or add it to your Home Screen, and it keeps working with this TV.</p>
  </section>

  <section id="unpaired" hidden>
    <p>Open Reel on the TV, select any text box, and scan the code that appears in the corner.</p>
  </section>
</main>
